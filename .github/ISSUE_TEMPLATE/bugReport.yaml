name: Bug Report Template
description: File a bug report using the Template
title: "[Bug]: "
labels: [BUG]
assignees: "FuryFight3r"
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Please provide as much information as possible to help us in helping you.
        > Don't like typing a bunch of words? Not a problem! Send in your Logfiles and a Screenshot/Video, these are almost always better than a Thousand Words anyway.
        ---

        # Bug Report

  - type: dropdown
    attributes:
      label: Have you tried Reloading?
      options:
        - "Please Select"
        - "No"
        - "Yes"
        - "Cannot Save/Exit due to bug"
    validations:
      required: true

  - type: dropdown
    attributes:
      label: (If 'Yes') what was the outcome after Reloading?
      options:
        - "Please Select"
        - Returned to Normal, But cannot Reproduce the Bug
        - Returned to Normal, But was able to reproduce the Bug again
        - Still Bugged immediately after Reloading the Game
        - Even worse after Reloading the Game
    validations:
      required: true

  - type: dropdown
    attributes:
      label: How is the Decimal Number Symbol normally Displayed to you In-Game (Specific bugs are Caused by 'Comma Bug')?
      options:
        - "Please Select"
        - "v0.35.6 & $45.75 (Dot Point)"
        - "v0,35,6 & $45,75 (Comma)"
        - "Other - Please explain further"
    validations:
      required: true

  - type: textarea
    id: bug_description
    attributes:
      label: Describe the Bug
      description: Please describe the Bug you encountered
      placeholder: |
        Please describe the Bug you encountered as best you can
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Please provide steps needed to repeat this Bug
      placeholder: |
        EXAMPLE;
        1. Go to the Personal Computer.
        2. Open the Games Folder.
        3. Leave Games Folder Open and exit the PC.
        4. Go to Sleep.
        5. Go back to the Personal Computer.
        6. Games Folder is now gone and cannot be Opened again.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshot(s)/Video(s)
      description: Please upload screenshots/videos and/or links to videos that help illustrate the issue (If unable to provide media just put 'Not Applicable' or 'N/A').
      placeholder: |
        Drag your Screenshot(s) below to upload them, Upload your video(s) to a Video Hosting service of choice (ie Youtube, Drive etc) and add the link(s) here.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Player Logs
      description: Provide your player logs - If unsure how - refer to the [Where to Find Log Files (Manually)](https://github.com/FuryFight3r/ScrappingSimulator/wiki/Where-to-find-Scrapping-Simulator-Save-File-and-Error-Logs)
      placeholder: |
        Please Click here and then Drag your [Player.log] and [Player-prev.log] below to upload the files.
        You can also add your Save-File here by archiving [Player.log], [Player-prev.log], and [Scrapping_Simulator_Data.es3] into a Zip file and dragging it here.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |          
        > [!CAUTION]
        > Please provide as much information as possible;
        > Less information = More time to Fix (if at all).
        > More information = Less time to Fix, Easier to understand and reporoduce the issue.
